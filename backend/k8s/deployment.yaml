apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-bug-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-bug-backend
  template:
    metadata:
      labels:
        app: ai-bug-backend
    spec:
      containers:
        - name: backend
          image: your-registry/ai-bug-backend:latest
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              value: "postgresql://postgres:postgres@postgres:5432/dev"
            - name: REDIS_URL
              value: "redis://redis:6379"
